name: Cognito probe (temporary)

on:
  push:
    paths: ['.github/workflows/cognito-probe.yml']

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Dump user pool and client config
        run: |
          POOL_ID=$(aws cloudformation describe-stacks --stack-name JournaBackendStack --query "Stacks[0].Outputs[?OutputKey=='UserPoolId'].OutputValue" --output text)
          CLIENT_ID=$(aws cloudformation describe-stacks --stack-name JournaBackendStack --query "Stacks[0].Outputs[?OutputKey=='UserPoolClientId'].OutputValue" --output text)
          echo "POOL_ID=$POOL_ID"
          echo "CLIENT_ID=$CLIENT_ID"
          aws cognito-idp describe-user-pool --user-pool-id "$POOL_ID" \
            --query 'UserPool.{AutoVerified:AutoVerifiedAttributes,AutoConfirmed:AutoConfirmedAttributes,UsernameAttributes:UsernameAttributes,FirstFactors:AllowedFirstAuthenticationFactors,Verification:UserVerificationMessage,EmailConfig:EmailConfiguration,Lambda:LambdaConfig}'
          aws cognito-idp describe-user-pool-client --user-pool-id "$POOL_ID" --client-id "$CLIENT_ID" \
            --query 'UserPoolClient.{Explicit:ExplicitAuthFlows,PreventUserExistenceErrors:PreventUserExistenceErrors,WriteAttributes:WriteAttributes,ReadAttributes:ReadAttributes}'

      - name: Confirm the probe user and set a password
        run: |
          POOL_ID=$(aws cloudformation describe-stacks --stack-name JournaBackendStack --query "Stacks[0].Outputs[?OutputKey=='UserPoolId'].OutputValue" --output text)
          aws cognito-idp admin-confirm-sign-up --user-pool-id "$POOL_ID" --username 'probe-signup-check@journa-test.invalid' || true
          aws cognito-idp admin-set-user-password --user-pool-id "$POOL_ID" --username 'probe-signup-check@journa-test.invalid' --password 'Journa-Test-2026!' --permanent || true
          aws cognito-idp admin-get-user --user-pool-id "$POOL_ID" --username 'probe-signup-check@journa-test.invalid' \
            --query 'UserStatus,UserStatus'
          echo "=== users in pool ==="
          aws cognito-idp list-users --user-pool-id "$POOL_ID" --query 'Users[].[Username,UserStatus,Enabled]'
