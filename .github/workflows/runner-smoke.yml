name: Runner smoke

# Temporary: checks that vars.CI_RUNNER resolves and that the probe handoff
# works, without touching AWS.
on:
  push:
    paths: ['.github/workflows/runner-smoke.yml']
  workflow_dispatch:

jobs:
  vars:
    runs-on: ["self-hosted", "journa-laptop"]
    steps:
      - name: Show vars
        run: |
          echo "CI_RUNNER=[${{ vars.CI_RUNNER }}]"
          echo "RAW=$CI_RUNNER"
          env | grep -i '^CI_RUNNER' || echo "not in env"

  probe:
    name: GitHub-hosted minutes
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 2
    outputs:
      hosted: ${{ steps.p.outputs.hosted }}
    steps:
      - id: p
        run: echo "hosted=true" >> "$GITHUB_OUTPUT"

  after:
    needs: probe
    if: ${{ !cancelled() }}
    runs-on: ${{ needs.probe.outputs.hosted == 'true' && 'ubuntu-latest' || vars.CI_RUNNER && fromJSON(vars.CI_RUNNER) || 'ubuntu-latest' }}
    steps:
      - run: |
          echo "hosted=[${{ needs.probe.outputs.hosted }}]"
          echo "runner=$RUNNER_NAME os=$RUNNER_OS"
          command -v aws && aws --version || echo "aws missing"
