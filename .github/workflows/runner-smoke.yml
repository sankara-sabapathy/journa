name: Runner smoke

# Temporary: reproduces the deploy.yml runner-selection pattern with trivial
# steps so the handoff can be debugged without touching AWS.
on:
  push:
    paths: ['.github/workflows/runner-smoke.yml']
  workflow_dispatch:

jobs:
  probe:
    name: GitHub-hosted minutes
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 2
    outputs:
      hosted: ${{ steps.p.outputs.hosted }}
    steps:
      - id: p
        run: echo "hosted=true" >> "$GITHUB_OUTPUT"

  after:
    needs: probe
    if: ${{ !cancelled() }}
    runs-on: ${{ needs.probe.outputs.hosted == 'true' && 'ubuntu-latest' || vars.CI_RUNNER && fromJSON(vars.CI_RUNNER) || 'ubuntu-latest' }}
    steps:
      - run: |
          echo "hosted=${{ needs.probe.outputs.hosted }}"
          echo "runner=$RUNNER_NAME os=$RUNNER_OS"
          command -v aws && aws --version || echo "aws missing"
          command -v node || echo "node missing (setup-node provides it)"
          command -v zip && zip --version | head -2 || echo "zip missing"
