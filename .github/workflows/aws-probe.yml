name: AWS probe (temporary)

# Temporary: checks whether this account records Cognito sign-in calls at all,
# so an OTP failure can be traced in AWS rather than guessed at. Deleted after
# the answer is read.
on:
  push:
    paths: ['.github/workflows/aws-probe.yml']
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1

jobs:
  probe:
    runs-on: ["self-hosted", "journa-laptop"]
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Identity
        run: aws sts get-caller-identity --output json

      - name: Pool add-ons (is advanced logging on?)
        run: |
          POOL_ID=$(aws cloudformation describe-stacks --stack-name JournaBackendStack --query "Stacks[0].Outputs[?OutputKey=='UserPoolId'].OutputValue" --output text)
          echo "pool=$POOL_ID"
          aws cognito-idp describe-user-pool --user-pool-id "$POOL_ID" --query 'UserPool.{AddOns:UserPoolAddOns,Policies:Policies}' --output json

      - name: CloudTrail, last 3 days, Cognito sign-in names
        run: |
          START=$(date -u -d '3 days ago' +%Y-%m-%dT%H:%M:%SZ)
          for NAME in RespondToAuthChallenge InitiateAuth ConfirmSignUp SignUp; do
            echo "--- $NAME ---"
            aws cloudtrail lookup-events \
              --start-time "$START" \
              --lookup-attributes AttributeKey=EventName,AttributeValue=$NAME \
              --max-results 5 \
              --query 'Events[].{Time:EventTime,Name:EventName,Err:CloudTrailEvent}' \
              --output json 2>&1 | head -40 || true
          done

      - name: CloudWatch log groups that look auth-related
        run: |
          aws logs describe-log-groups --query 'logGroups[].logGroupName' --output json 2>&1 | head -30 || true
