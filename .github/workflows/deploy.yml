name: Deploy

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'infra/**'
      - '.github/workflows/deploy.yml'

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  AWS_ACCOUNT_ID: '612850243659'

jobs:
  deploy:
    # The runner is chosen by the CI_RUNNER repo variable: set it to a JSON
    # runs-on value (e.g. ["self-hosted","journa-laptop"]) while GitHub-hosted
    # minutes are exhausted, and delete it to go back to ubuntu-latest.
    #
    # A probe job that tests hosted availability cannot work here: when the
    # account is out of minutes the hosted job never starts, and GitHub drops
    # every job that needs it, even with always(). Keeping the choice in a
    # variable makes the run deterministic either way.
    runs-on: ["self-hosted", "journa-laptop"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          # Self-hosted runners keep ~/.npm, so no GitHub cache here.
          cache: ''

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install infra dependencies
        run: |
          npm ci
          npm run build
          npm run build:web
        working-directory: infra

      - name: Bootstrap CDK (idempotent)
        run: npx cdk bootstrap aws://${{ env.AWS_ACCOUNT_ID }}/ap-south-1
        working-directory: infra

      - name: Build web function bundle
        run: |
          npm run build:web
          cd dist-web && zip ../web.zip index.js && cd ..
          HASH=$(sha256sum web.zip | cut -d' ' -f1 | cut -c1-16)
          echo "bundle_key=web-$HASH.zip" >> "$GITHUB_OUTPUT"
          aws s3 cp web.zip s3://journa-webcode-${{ env.AWS_ACCOUNT_ID }}/web-$HASH.zip
        id: webbundle
        working-directory: infra

      - name: Deploy backend stack
        run: npx cdk deploy JournaBackendStack --require-approval never --parameters JournaBackendStack:WebCodeKey=${{ steps.webbundle.outputs.bundle_key }}
        working-directory: infra

      - name: Read backend outputs
        id: backend
        run: |
          API_URL=$(aws cloudformation describe-stacks --stack-name JournaBackendStack --query "Stacks[0].Outputs[?OutputKey=='BackendApiUrl'].OutputValue" --output text)
          CLIENT_ID=$(aws cloudformation describe-stacks --stack-name JournaBackendStack --query "Stacks[0].Outputs[?OutputKey=='UserPoolClientId'].OutputValue" --output text)
          echo "api_url=$API_URL" >> "$GITHUB_OUTPUT"
          echo "client_id=$CLIENT_ID" >> "$GITHUB_OUTPUT"

      - name: Deploy frontend stack
        run: npx cdk deploy JournaFrontendStack --require-approval never
        working-directory: infra

      - name: Read frontend outputs
        id: outputs
        run: |
          BUCKET=$(aws cloudformation describe-stacks --stack-name JournaFrontendStack --query "Stacks[0].Outputs[?OutputKey=='SiteBucketName'].OutputValue" --output text)
          DIST_ID=$(aws cloudformation describe-stacks --stack-name JournaFrontendStack --query "Stacks[0].Outputs[?OutputKey=='DistributionId'].OutputValue" --output text)
          echo "bucket=$BUCKET" >> "$GITHUB_OUTPUT"
          echo "dist_id=$DIST_ID" >> "$GITHUB_OUTPUT"

      - name: Build site
        run: |
          npm ci
          npm run build
        env:
          VITE_JOURNA_API_URL: ${{ steps.backend.outputs.api_url }}
          VITE_COGNITO_REGION: ap-south-1
          VITE_COGNITO_CLIENT_ID: ${{ steps.backend.outputs.client_id }}

      - name: Sync to S3
        run: aws s3 sync dist/ "s3://${{ steps.outputs.outputs.bucket }}" --delete

      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id "${{ steps.outputs.outputs.dist_id }}" --paths "/*"
