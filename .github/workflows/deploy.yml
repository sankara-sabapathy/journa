name: Deploy

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'infra/**'
      - '.github/workflows/deploy.yml'

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  AWS_ACCOUNT_ID: '612850243659'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install infra dependencies
        run: |
          npm ci
          npm run build
          npm run build:web
        working-directory: infra

      - name: Bootstrap CDK (idempotent)
        run: npx cdk bootstrap aws://${{ env.AWS_ACCOUNT_ID }}/ap-south-1
        working-directory: infra

      - name: Build web function bundle
        run: |
          npm run build:web
          cd dist-web && zip ../web.zip index.js && cd ..
          aws s3 cp web.zip s3://journa-webcode-${{ env.AWS_ACCOUNT_ID }}/web-${{ github.sha }}.zip
        working-directory: infra

      - name: Deploy backend stack
        run: npx cdk deploy JournaBackendStack --require-approval never --parameters JournaBackendStack:WebCodeKey=web-${{ github.sha }}.zip
        working-directory: infra

      - name: Read backend outputs
        id: backend
        run: |
          API_URL=$(aws cloudformation describe-stacks --stack-name JournaBackendStack --query "Stacks[0].Outputs[?OutputKey=='BackendApiUrl'].OutputValue" --output text)
          CLIENT_ID=$(aws cloudformation describe-stacks --stack-name JournaBackendStack --query "Stacks[0].Outputs[?OutputKey=='UserPoolClientId'].OutputValue" --output text)
          echo "api_url=$API_URL" >> "$GITHUB_OUTPUT"
          echo "client_id=$CLIENT_ID" >> "$GITHUB_OUTPUT"

      - name: Deploy frontend stack
        run: npx cdk deploy JournaFrontendStack --require-approval never
        working-directory: infra

      - name: Read frontend outputs
        id: outputs
        run: |
          BUCKET=$(aws cloudformation describe-stacks --stack-name JournaFrontendStack --query "Stacks[0].Outputs[?OutputKey=='SiteBucketName'].OutputValue" --output text)
          DIST_ID=$(aws cloudformation describe-stacks --stack-name JournaFrontendStack --query "Stacks[0].Outputs[?OutputKey=='DistributionId'].OutputValue" --output text)
          echo "bucket=$BUCKET" >> "$GITHUB_OUTPUT"
          echo "dist_id=$DIST_ID" >> "$GITHUB_OUTPUT"

      - name: Build site
        run: |
          npm ci
          npm run build
        env:
          VITE_JOURNA_API_URL: ${{ steps.backend.outputs.api_url }}
          VITE_COGNITO_REGION: ap-south-1
          VITE_COGNITO_CLIENT_ID: ${{ steps.backend.outputs.client_id }}

      - name: Sync to S3
        run: aws s3 sync dist/ "s3://${{ steps.outputs.outputs.bucket }}" --delete

      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id "${{ steps.outputs.outputs.dist_id }}" --paths "/*"
